name: FFmpeg compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 0'

permissions:
  contents: read

jobs:
  linux-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ffmpeg: [6.1.6, 7.1.5, 8.1.2, 9.0.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Build the official FFmpeg release
        run: |
          ./scripts/install-ffmpeg-version.sh "${{ matrix.ffmpeg }}" "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run test:integration
